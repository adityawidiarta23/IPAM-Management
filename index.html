  <script>
    /**
     * =========================================================================
     * 1. KONSTANTA, UTILITAS BITWISE SUBNET (UNSIGNED 32-BIT), & HELPER
     * =========================================================================
     */
    const STORAGE_KEY = 'noc_ipam_vlan_regional_v2';

    const VLAN_CATEGORIES = [
      'Core/Backbone',
      'Management',
      'FTTH/Access',
      'Corporate/Enterprise',
      'Transit/Peering',
      'Guest/DMZ'
    ];

    const POP_TYPES = ['Core', 'Distribution', 'Access', 'Edge'];
    const POP_STATUSES = ['Aktif', 'Maintenance', 'Planned'];

    const DEVICE_VENDORS = [
      'Router (MikroTik)',
      'Router (Huawei)',
      'Router (Juniper)',
      'Router (Cisco)',
      'Switch (Ruijie/Huawei)',
      'OLT (ZTE)',
      'OLT (BDCOM)',
      'Server / VM',
      'ONT / CPE',
      'Lainnya'
    ];

    const CATEGORY_COLORS = {
      'Core/Backbone':        { bg: 'bg-violet-500/15',  text: 'text-violet-300',  border: 'border-violet-500/30',  bar: 'bg-violet-500' },
      'Management':           { bg: 'bg-cyan-500/15',    text: 'text-cyan-300',    border: 'border-cyan-500/30',    bar: 'bg-cyan-500' },
      'FTTH/Access':          { bg: 'bg-emerald-500/15', text: 'text-emerald-300', border: 'border-emerald-500/30', bar: 'bg-emerald-500' },
      'Corporate/Enterprise': { bg: 'bg-blue-500/15',    text: 'text-blue-300',    border: 'border-blue-500/30',    bar: 'bg-blue-500' },
      'Transit/Peering':      { bg: 'bg-amber-500/15',   text: 'text-amber-300',   border: 'border-amber-500/30',   bar: 'bg-amber-500' },
      'Guest/DMZ':            { bg: 'bg-pink-500/15',    text: 'text-pink-300',    border: 'border-pink-500/30',    bar: 'bg-pink-500' }
    };

    const POP_TYPE_COLORS = {
      'Core':         'bg-violet-500/15 text-violet-300 border-violet-500/30',
      'Distribution': 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30',
      'Access':       'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
      'Edge':         'bg-amber-500/15 text-amber-300 border-amber-500/30'
    };

    /** Validasi IPv4 string dan konversi ke Unsigned 32-bit Integer */
    function ipToInt(ip) {
      if (typeof ip !== 'string') return null;
      const parts = ip.trim().split('.');
      if (parts.length !== 4) return null;
      let num = 0;
      for (let i = 0; i < 4; i++) {
        if (!/^\d+$/.test(parts[i])) return null;
        const octet = Number(parts[i]);
        if (octet < 0 || octet > 255) return null;
        num = ((num << 8) | octet) >>> 0;
      }
      return num >>> 0;
    }

    /** Konversi Unsigned 32-bit Integer ke string IPv4 */
    function intToIp(intVal) {
      const u = intVal >>> 0;
      return [(u >>> 24) & 255, (u >>> 16) & 255, (u >>> 8) & 255, u & 255].join('.');
    }

    /** Konversi Unsigned 32-bit Integer ke biner 32-bit bertitik */
    function intToBinary(intVal) {
      const u = intVal >>> 0;
      return [
        ((u >>> 24) & 255).toString(2).padStart(8, '0'),
        ((u >>> 16) & 255).toString(2).padStart(8, '0'),
        ((u >>> 8) & 255).toString(2).padStart(8, '0'),
        (u & 255).toString(2).padStart(8, '0')
      ].join('.');
    }

    function getIpClassAndType(ipInt) {
      const first = (ipInt >>> 24) & 255;
      const second = (ipInt >>> 16) & 255;
      let ipClass = 'Kelas A';
      if (first >= 1 && first <= 126) ipClass = 'Kelas A';
      else if (first === 127) ipClass = 'Loopback';
      else if (first >= 128 && first <= 191) ipClass = 'Kelas B';
      else if (first >= 192 && first <= 223) ipClass = 'Kelas C';
      else if (first >= 224 && first <= 239) ipClass = 'Kelas D (Multicast)';
      else ipClass = 'Kelas E (Reserved)';

      let ipType = 'Public IP';
      if (first === 10) ipType = 'Private (RFC 1918)';
      else if (first === 172 && second >= 16 && second <= 31) ipType = 'Private (RFC 1918)';
      else if (first === 192 && second === 168) ipType = 'Private (RFC 1918)';
      else if (first === 100 && second >= 64 && second <= 127) ipType = 'CGNAT (RFC 6598)';
      else if (first === 127) ipType = 'Loopback (RFC 1122)';
      else if (first === 169 && second === 254) ipType = 'Link-Local (APIPA)';
      else if (first >= 224) ipType = 'Multicast / Reserved';

      return { ipClass, ipType };
    }

    /** Kalkulasi detail subnet menggunakan operasi bitwise 32-bit unsigned */
    function calculateSubnet(ipStr, prefixNum) {
      const ipInt = ipToInt(ipStr);
      const prefix = Number(prefixNum);
      if (ipInt === null || isNaN(prefix) || prefix < 0 || prefix > 32) return null;

      const maskInt = prefix === 0 ? 0 : ((0xFFFFFFFF << (32 - prefix)) >>> 0);
      const wildcardInt = (~maskInt) >>> 0;
      const networkInt = (ipInt & maskInt) >>> 0;
      const broadcastInt = (networkInt | wildcardInt) >>> 0;
      const totalIps = Math.pow(2, 32 - prefix);

      let firstUsableInt, lastUsableInt, usableHosts;
      if (prefix === 32) {
        firstUsableInt = networkInt;
        lastUsableInt = networkInt;
        usableHosts = 1;
      } else if (prefix === 31) {
        firstUsableInt = networkInt;
        lastUsableInt = broadcastInt;
        usableHosts = 2;
      } else {
        firstUsableInt = (networkInt + 1) >>> 0;
        lastUsableInt = (broadcastInt - 1) >>> 0;
        usableHosts = Math.max(0, totalIps - 2);
      }

      const { ipClass, ipType } = getIpClassAndType(networkInt);

      return {
        inputIp: intToIp(ipInt),
        prefix,
        cidr: `${intToIp(networkInt)}/${prefix}`,
        networkInt,
        network: intToIp(networkInt),
        broadcastInt,
        broadcast: intToIp(broadcastInt),
        maskInt,
        netmask: intToIp(maskInt),
        wildcardInt,
        wildcard: intToIp(wildcardInt),
        firstUsableInt,
        firstUsable: intToIp(firstUsableInt),
        lastUsableInt,
        lastUsable: intToIp(lastUsableInt),
        totalIps,
        usableHosts,
        ipClass,
        ipType,
        binIp: intToBinary(ipInt),
        binMask: intToBinary(maskInt),
        binNetwork: intToBinary(networkInt),
        binBroadcast: intToBinary(broadcastInt)
      };
    }

    function parseCIDR(cidrStr) {
      if (typeof cidrStr !== 'string') return null;
      const parts = cidrStr.trim().split('/');
      if (parts.length !== 2 || !/^\d+$/.test(parts[1])) return null;
      const prefix = Number(parts[1]);
      if (prefix < 8 || prefix > 32) return null;
      return calculateSubnet(parts[0], prefix);
    }

    function isIpInSubnet(ipStr, cidrStr) {
      const info = parseCIDR(cidrStr);
      const ipInt = ipToInt(ipStr);
      if (!info || ipInt === null) return false;
      return ipInt >= info.networkInt && ipInt <= info.broadcastInt;
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function formatTimeNow() {
      return new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function getUtilColor(pct) {
      if (pct >= 90) return { bar: 'bg-rose-500', text: 'text-rose-400', badge: 'bg-rose-500/15 text-rose-300 border-rose-500/30', label: 'Kritis' };
      if (pct >= 70) return { bar: 'bg-amber-500', text: 'text-amber-400', badge: 'bg-amber-500/15 text-amber-300 border-amber-500/30', label: 'Peringatan' };
      return { bar: 'bg-emerald-500', text: 'text-emerald-400', badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30', label: 'Aman' };
    }

    /**

    function getDefaultData() {
      return {

          { id: 'reg_3', code: 'REG-3', name: 'Regional 3', areas: 'Lombok', description: 'Wilayah operasional Nusa Tenggara Barat (Pulau Lombok).' },

        ],
        pops: [
          { id: 'pop_jkt_01', regionalId: 'reg_1', code: 'POP-JKT-01', name: 'POP Jakarta', area: 'Jakarta', type: 'Core', address: 'Gedung Cyber 1 Lt. 5, Kuningan Barat, Jakarta Selatan', status: 'Aktif', notes: 'Core Nasional, Peering IIX/OpenIXP, dan Upstream Transit.' },
          { id: 'pop_bks_01', regionalId: 'reg_1', code: 'POP-BKS-01', name: 'POP Bekasi', area: 'Bekasi', type: 'Distribution', address: 'Jl. Ahmad Yani No. 88, Bekasi Selatan', status: 'Aktif', notes: 'Distribusi FTTH Bekasi & Corporate Kawasan Industri.' },

    function fetch() {
      try {
        const raw = async function loadData();
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.regionals) && Array.isArray(parsed.pops) && Array.isArray(parsed.subnets) && Array.isArray(parsed.vlans) && Array.isArray(parsed.hosts)) {
            if (!Array.isArray(parsed.logs)) parsed.logs = [];
            return parsed;
          }
        }
      } catch (err) {
        console.error('Gagal membaca localStorage:', err);
      }
      const def = getDefaultData();
      saveData(def);
      return def;
    }

    function saveData(dataObj = db) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
      } catch (err) {
        console.error('Gagal menyimpan localStorage:', err);
        showToast('Gagal menyimpan data ke penyimpanan lokal browser.', 'error');
      }
    }

    function addLog(action, detail, type = 'cyan') {
      db.logs.unshift({ id: uid('log'), time: formatTimeNow(), action, detail, type });
      if (db.logs.length > 30) db.logs.length = 30;
      saveData();
    }

    function getRegionalById(id) { return db.regionals.find(r => r.id === id) || null; }
    function getPopById(id) { return db.pops.find(p => p.id === id) || null; }
    function getVlanById(id) { return db.vlans.find(v => v.id === id) || null; }
    function getPopsByRegional(regId) {
      if (!regId || regId === 'ALL') return db.pops;
      return db.pops.filter(p => p.regionalId === regId);
    }

    function getSubnetStats(subnet) {
      const calc = parseCIDR(subnet.cidr);
      const hosts = db.hosts.filter(h => h.subnetId === subnet.id && h.status !== 'Free');
      const usedCount = hosts.length;
      const totalUsable = calc ? calc.usableHosts : 0;
      const pct = totalUsable > 0 ? Math.min(100, Math.round((usedCount / totalUsable) * 100)) : 0;
      return { calc, hosts, usedCount, totalUsable, pct };
    }

    function getRegionalStats(regId) {
      const pops = db.pops.filter(p => p.regionalId === regId);
      const subnets = db.subnets.filter(s => s.regionalId === regId);
      const vlans = db.vlans.filter(v => v.regionalId === regId);
      const subIds = new Set(subnets.map(s => s.id));
      const hosts = db.hosts.filter(h => subIds.has(h.subnetId));
      let totalUsable = 0, totalUsed = 0;
      subnets.forEach(s => {
        const st = getSubnetStats(s);
        totalUsable += st.totalUsable;
        totalUsed += st.usedCount;
      });
      const pct = totalUsable > 0 ? Math.round((totalUsed / totalUsable) * 100) : 0;
      return { pops, subnets, vlans, hosts, totalUsable, totalUsed, pct };
    }

    function getPopStats(popId) {
      const subnets = db.subnets.filter(s => s.popId === popId);
      const vlans = db.vlans.filter(v => v.popId === popId);
      const subIds = new Set(subnets.map(s => s.id));
      const hosts = db.hosts.filter(h => subIds.has(h.subnetId));
      return { subnets, vlans, hosts };
    }

    function toggleSidebar(open) {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (open) { sb.classList.remove('-translate-x-full'); bd.classList.remove('hidden'); }
      else { sb.classList.add('-translate-x-full'); bd.classList.add('hidden'); }
    }

    function navigate(view, opts = {}) {
      uiState.currentView = view;
      if (view === 'subnets' && opts.subnetId !== undefined) {
        uiState.selectedSubnetId = opts.subnetId;
        uiState.ipGridPage = 0;
        uiState.ipGridFilterStatus = 'ALL';
        uiState.ipGridSearch = '';
      } else if (view !== 'subnets') {
        uiState.selectedSubnetId = null;
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.nav === view;
        if (isActive) {
          btn.classList.add('bg-cyan-500/15', 'text-cyan-300', 'border', 'border-cyan-500/30');
          btn.classList.remove('text-slate-300', 'hover:bg-slate-900');
        } else {
          btn.classList.remove('bg-cyan-500/15', 'text-cyan-300', 'border', 'border-cyan-500/30');
          btn.classList.add('text-slate-300', 'hover:bg-slate-900');
        }
      });

      toggleSidebar(false);
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentView() {
      const container = document.getElementById('app-content');
      if (uiState.currentView === 'dashboard') container.innerHTML = renderDashboardView();
      else if (uiState.currentView === 'regional') container.innerHTML = renderRegionalPopView();
      else if (uiState.currentView === 'subnets') {
        container.innerHTML = uiState.selectedSubnetId ? renderSubnetDetailView(uiState.selectedSubnetId) : renderSubnetsListView();
      }
      else if (uiState.currentView === 'vlans') container.innerHTML = renderVlansView();
      else if (uiState.currentView === 'hosts') container.innerHTML = renderHostsView();
      else if (uiState.currentView === 'calculator') container.innerHTML = renderCalculatorView();
      else if (uiState.currentView === 'backup') container.innerHTML = renderBackupView();

      const styles = {

        error:   'bg-slate-900 border-rose-500/40 text-rose-300',
        info:    'bg-slate-900 border-cyan-500/40 text-cyan-300',
        warning: 'bg-slate-900 border-amber-500/40 text-amber-300'
      };
      const icons = { success: 'check-circle-2', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl shadow-black/50 text-sm font-medium transition-all duration-300 ${styles[type] || styles.info}`;
      el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i><span class="text-slate-100 flex-1">${esc(message)}</span>`;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);

                    <th class="py-3.5 px-4">Nama / Deskripsi</th>
                    <th class="py-3.5 px-4">Regional & POP</th>
                    <th class="py-3.5 px-4">VLAN Terkait</th>
                    <th class="py-3.5 px-4">Gateway & Range</th>
                    <th class="py-3.5 px-4 min-w-[160px]">Utilisasi</th>
                    <th class="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70">
                  ${filtered.length === 0 ? `<tr><td colspan="7" class="py-10 text-center text-slate-500">Tidak ada subnet yang cocok dengan filter.</td></tr>` :
                    filtered.map(s => {
                      const { calc, usedCount, totalUsable, pct } = getSubnetStats(s);
                      const uc = getUtilColor(pct);
                      const reg = getRegionalById(s.regionalId);
                      const pop = getPopById(s.popId);
                      const vlan = getVlanById(s.vlanRefId);
                      return `
                        <tr class="hover:bg-slate-800/40 transition">
                          <td class="py-3.5 px-4">
                            <button onclick="navigate('subnets', { subnetId: '${s.id}' })" class="font-mono font-semibold text-cyan-400 hover:underline">${esc(s.cidr)}</button>
                            <div class="text-[11px] font-mono text-slate-500 mt-0.5">${calc ? calc.netmask : '-'}</div>
                          </td>
                          <td class="py-3.5 px-4">
                            <div class="font-medium text-white">${esc(s.name)}</div>
                            <div class="text-xs text-slate-500 line-clamp-1 max-w-xs">${esc(s.notes || '-')}</div>
                          </td>
                          <td class="py-3.5 px-4 text-xs">
                            <div class="text-slate-200 font-medium">${pop ? esc(pop.name) : '-'}</div>
                            <div class="text-slate-500 mt-0.5">${reg ? esc(reg.name) : '-'}</div>
                          </td>
                          <td class="py-3.5 px-4">
                            ${vlan ? `<button onclick="openVlanDetailModal('${vlan.id}')" class="px-2 py-0.5 rounded-md bg-violet-500/15 hover:bg-violet-500/25 border border-violet-500/30 text-violet-300 font-mono text-xs transition">VLAN ${vlan.vlanId}</button>` : `<span class="text-xs text-slate-500 italic">-</span>`}
                          </td>
                          <td class="py-3.5 px-4 font-mono text-xs">
                            <div class="text-emerald-400">GW: ${esc(s.gateway || '-')}</div>
                            <div class="text-slate-400 mt-0.5">${calc ? `${calc.firstUsable}–${calc.lastUsable}` : '-'}</div>
                          </td>
                          <td class="py-3.5 px-4">
                            <div class="flex items-center justify-between text-xs mb-1">
                              <span class="font-mono text-slate-300">${usedCount}/${totalUsable}</span>
                              <span class="font-mono font-semibold ${uc.text}">${pct}%</span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                              <div class="h-full ${uc.bar} rounded-full" style="width: ${Math.max(pct, 2)}%"></div>
                            </div>
                          </td>
                          <td class="py-3.5 px-4 text-right whitespace-nowrap">
                            <div class="inline-flex items-center gap-1.5">
                              <button onclick="navigate('subnets', { subnetId: '${s.id}' })" class="px-2.5 py-1.5 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-cyan-300 text-xs font-medium inline-flex items-center gap-1 transition">
                                <i data-lucide="grid-3x3" class="w-3.5 h-3.5"></i> IP Map
                              </button>
                              <button onclick="openSubnetModal('${s.id}')" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                              <button onclick="deleteSubnet('${s.id}')" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =========================================================================
     * 8. VIEW 3B: DETAIL SUBNET & VISUAL IP MAP GRID
     * =========================================================================
     */
    function renderSubnetDetailView(subnetId) {
      const subnet = db.subnets.find(s => s.id === subnetId);
      if (!subnet) { uiState.selectedSubnetId = null; return renderSubnetsListView(); }

      const { calc, hosts, usedCount, totalUsable, pct } = getSubnetStats(subnet);
      const uc = getUtilColor(pct);
      const reg = getRegionalById(subnet.regionalId);
      const pop = getPopById(subnet.popId);
      const vlan = getVlanById(subnet.vlanRefId);

      const hostMap = new Map();
      hosts.forEach(h => hostMap.set(h.ip, h));

      const pageSize = 256;
      const totalPages = Math.ceil(calc.totalIps / pageSize);
      if (uiState.ipGridPage >= totalPages) uiState.ipGridPage = 0;

      const startInt = (calc.networkInt + uiState.ipGridPage * pageSize) >>> 0;
      const endInt = Math.min(calc.broadcastInt, (startInt + pageSize - 1) >>> 0);

      const q = uiState.ipGridSearch.trim().toLowerCase();
      const tiles = [];
      for (let ipInt = startInt; ipInt <= endInt; ipInt++) {
        const ipStr = intToIp(ipInt);
        const host = hostMap.get(ipStr);
        const isNetwork = (calc.prefix <= 30 && ipInt === calc.networkInt);
        const isBroadcast = (calc.prefix <= 30 && ipInt === calc.broadcastInt);
        const isGateway = (subnet.gateway && ipStr === subnet.gateway);

        let categoryStatus = 'Available';
        if (isNetwork) categoryStatus = 'Network';
        else if (isBroadcast) categoryStatus = 'Broadcast';
        else if (host) categoryStatus = host.status;
        else if (isGateway) categoryStatus = 'Gateway';

        if (uiState.ipGridFilterStatus !== 'ALL') {
          if (uiState.ipGridFilterStatus === 'Available' && categoryStatus !== 'Available') continue;
          if (uiState.ipGridFilterStatus === 'Active' && categoryStatus !== 'Active' && !isGateway) continue;
          if (uiState.ipGridFilterStatus === 'Reserved' && categoryStatus !== 'Reserved' && categoryStatus !== 'DHCP') continue;
        }

        if (q) {
          const matchIp = ipStr.includes(q);
          const matchHost = host && ((host.hostname || '').toLowerCase().includes(q) || (host.mac || '').toLowerCase().includes(q) || (host.vendor || '').toLowerCase().includes(q));
          if (!matchIp && !matchHost) continue;
        }

        const lastOctet = ipInt & 255;
        let tileClass = 'bg-slate-950/80 border-slate-800 text-slate-400 hover:border-emerald-500/60 hover:text-emerald-300';
        let dotClass = 'bg-emerald-500/40';
        let label = 'Free';

        if (isNetwork) {
          tileClass = 'bg-violet-500/15 border-violet-500/40 text-violet-300 cursor-not-allowed opacity-85';
          dotClass = 'bg-violet-400'; label = 'NET';
        } else if (isBroadcast) {
          tileClass = 'bg-rose-500/15 border-rose-500/40 text-rose-300 cursor-not-allowed opacity-85';
          dotClass = 'bg-rose-400'; label = 'BCAST';
        } else if (isGateway) {
          tileClass = 'bg-indigo-500/20 border-indigo-400/60 text-indigo-200 shadow-sm shadow-indigo-500/20';
          dotClass = 'bg-indigo-400'; label = 'GW';
        } else if (host && host.status === 'Active') {
          tileClass = 'bg-cyan-500/15 border-cyan-500/50 text-cyan-200 hover:border-cyan-400';
          dotClass = 'bg-cyan-400'; label = host.hostname ? host.hostname.slice(0, 10) : 'Active';
        } else if (host && (host.status === 'Reserved' || host.status === 'DHCP')) {
          tileClass = 'bg-amber-500/15 border-amber-500/50 text-amber-200 hover:border-amber-400';
          dotClass = 'bg-amber-400'; label = host.status === 'DHCP' ? 'DHCP' : 'RESV';
        }

        const clickable = !isNetwork && !isBroadcast;
        const tooltip = isNetwork ? `${ipStr} (Network Address)` :
                        isBroadcast ? `${ipStr} (Broadcast Address)` :
                        host ? `${ipStr} • ${host.hostname || '-'} (${host.vendor}) [${host.status}]` :
                        isGateway ? `${ipStr} (Default Gateway — Klik untuk edit)` :
                        `${ipStr} (Available — Klik untuk Assign IP)`;

        tiles.push(`
          <button ${clickable ? `onclick="openIpModal('${subnet.id}', '${ipStr}')"` : 'disabled'} title="${esc(tooltip)}"
            class="ip-tile relative flex flex-col items-start justify-between p-2 rounded-xl border text-left min-h-[58px] ${tileClass}">
            <div class="w-full flex items-center justify-between gap-1">
              <span class="font-mono text-xs font-bold">.${lastOctet}</span>
              <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
            </div>
            <span class="text-[10px] font-mono truncate w-full opacity-90 mt-1">${esc(label)}</span>
          </button>
        `);
      }

      return `
        <div class="space-y-5">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-start gap-3">
              <button onclick="navigate('subnets', { subnetId: null })" class="mt-0.5 p-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
              </button>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h2 class="text-xl lg:text-2xl font-bold font-mono text-cyan-400">${esc(subnet.cidr)}</h2>
                  <span class="text-base font-semibold text-white">${esc(subnet.name)}</span>
                  ${vlan ? `<button onclick="openVlanDetailModal('${vlan.id}')" class="px-2.5 py-0.5 rounded-lg bg-violet-500/15 border border-violet-500/30 text-violet-300 font-mono text-xs hover:bg-violet-500/25">VLAN ${vlan.vlanId}</button>` : ''}
                </div>
                <p class="text-xs text-slate-400 mt-1">
                  <span class="text-cyan-400 font-medium">${reg ? esc(reg.name) : '-'}</span> •
                  <span class="text-slate-200 font-medium">${pop ? `${esc(pop.name)} (${esc(pop.code)})` : '-'}</span> •
                  ${esc(subnet.notes || 'Tidak ada catatan.')}
                </p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openIpModal('${subnet.id}', '')" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium shadow-lg shadow-cyan-600/20 transition">
                <i data-lucide="plus" class="w-4 h-4"></i> Assign IP
              </button>
              <button onclick="openSubnetModal('${subnet.id}')" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-sm font-medium transition">
                <i data-lucide="pencil" class="w-4 h-4"></i> Edit Subnet
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5"><div class="text-[11px] text-slate-500 uppercase">Network</div><div class="font-mono text-sm font-semibold text-violet-300 mt-1">${calc.network}</div></div>
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5"><div class="text-[11px] text-slate-500 uppercase">Netmask</div><div class="font-mono text-sm font-semibold text-slate-200 mt-1">${calc.netmask}</div></div>
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5"><div class="text-[11px] text-slate-500 uppercase">Wildcard</div><div class="font-mono text-sm font-semibold text-slate-300 mt-1">${calc.wildcard}</div></div>
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5"><div class="text-[11px] text-slate-500 uppercase">Broadcast</div><div class="font-mono text-sm font-semibold text-rose-300 mt-1">${calc.broadcast}</div></div>
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5"><div class="text-[11px] text-slate-500 uppercase">Gateway</div><div class="font-mono text-sm font-semibold text-indigo-300 mt-1">${esc(subnet.gateway || '-')}</div></div>
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5">
              <div class="text-[11px] text-slate-500 uppercase">Utilisasi</div>
              <div class="flex items-center justify-between mt-1"><span class="font-mono text-sm font-bold ${uc.text}">${pct}%</span><span class="font-mono text-xs text-slate-400">${usedCount}/${totalUsable}</span></div>
              <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-1.5"><div class="h-full ${uc.bar}" style="width: ${Math.max(pct, 2)}%"></div></div>
            </div>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div>
                <h3 class="text-base font-semibold text-white">Visual IP Map Grid</h3>
                <p class="text-xs text-slate-400 mt-0.5">Klik kotak IP mana saja untuk assign atau edit perangkat.</p>
              </div>
              <div class="flex flex-wrap items-center gap-3 text-xs">
                <span class="flex items-center gap-1.5 text-slate-300"><span class="w-3 h-3 rounded bg-slate-950 border border-emerald-500/60"></span>Available</span>
                <span class="flex items-center gap-1.5 text-cyan-300"><span class="w-3 h-3 rounded bg-cyan-500/30 border border-cyan-400"></span>Active</span>
                <span class="flex items-center gap-1.5 text-amber-300"><span class="w-3 h-3 rounded bg-amber-500/30 border border-amber-400"></span>Reserved/DHCP</span>
                <span class="flex items-center gap-1.5 text-indigo-300"><span class="w-3 h-3 rounded bg-indigo-500/30 border border-indigo-400"></span>Gateway</span>
                <span class="flex items-center gap-1.5 text-violet-300"><span class="w-3 h-3 rounded bg-violet-500/30 border border-violet-400"></span>Net / Bcast</span>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
              <div class="flex flex-col sm:flex-row gap-2.5 flex-1">
                <div class="relative flex-1 max-w-sm">
                  <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="text" value="${esc(uiState.ipGridSearch)}" oninput="uiState.ipGridSearch = this.value; renderCurrentView();" placeholder="Filter IP, Hostname, MAC..." class="w-full pl-9 pr-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:border-cyan-500 outline-none" />
                </div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${['ALL', 'Available', 'Active', 'Reserved'].map(st => `
                    <button onclick="uiState.ipGridFilterStatus = '${st}'; renderCurrentView();" class="px-3 py-1.5 rounded-xl text-xs font-medium border transition ${uiState.ipGridFilterStatus === st ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}">
                      ${st === 'ALL' ? 'Semua' : st === 'Reserved' ? 'Reserved/DHCP' : st}
                    </button>
                  `).join('')}
                </div>
              </div>
              ${totalPages > 1 ? `
                <div class="flex items-center gap-2 text-xs">
                  <button onclick="uiState.ipGridPage = Math.max(0, uiState.ipGridPage - 1); renderCurrentView();" ${uiState.ipGridPage === 0 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-slate-800 disabled:opacity-40 text-slate-200">← Prev /24</button>
                  <span class="font-mono text-slate-400">Blok ${uiState.ipGridPage + 1}/${totalPages}</span>
                  <button onclick="uiState.ipGridPage = Math.min(${totalPages - 1}, uiState.ipGridPage + 1); renderCurrentView();" ${uiState.ipGridPage >= totalPages - 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-slate-800 disabled:opacity-40 text-slate-200">Next /24 →</button>
                </div>
              ` : ''}
            </div>

            <div class="grid gap-2 pt-2" style="grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));">
              ${tiles.length ? tiles.join('') : `<div class="col-span-full py-8 text-center text-sm text-slate-500">Tidak ada IP yang sesuai filter.</div>`}
            </div>
          </div>

          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-5 py-3.5 border-b border-slate-800 font-semibold text-sm text-white">Daftar Host Teralokasi (${hosts.length})</div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-950/80 border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-400">
                    <th class="py-3 px-4">IP Address</th><th class="py-3 px-4">Status</th><th class="py-3 px-4">Hostname</th><th class="py-3 px-4">Perangkat</th><th class="py-3 px-4">MAC & Interface</th><th class="py-3 px-4">PIC / Deskripsi</th><th class="py-3 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/70">
                  ${hosts.length === 0 ? `<tr><td colspan="7" class="py-8 text-center text-slate-500">Belum ada host teralokasi.</td></tr>` :
                    hosts.sort((a, b) => ipToInt(a.ip) - ipToInt(b.ip)).map(h => `
                      <tr class="hover:bg-slate-800/40">
                        <td class="py-3 px-4 font-mono text-cyan-400 font-semibold">${esc(h.ip)}</td>
                        <td class="py-3 px-4">${renderHostStatusBadge(h.status)}</td>
                        <td class="py-3 px-4 font-medium text-white">${esc(h.hostname || '-')}</td>
                        <td class="py-3 px-4 text-xs text-slate-300">${esc(h.vendor || '-')}</td>
                        <td class="py-3 px-4 font-mono text-xs"><div class="text-slate-300">${esc(h.mac || '-')}</div><div class="text-slate-500">${esc(h.iface || '-')}</div></td>
                        <td class="py-3 px-4 text-xs text-slate-300"><div>${esc(h.pic || '-')}</div><div class="text-slate-500 text-[11px]">${esc(h.notes || '')}</div></td>
                        <td class="py-3 px-4 text-right whitespace-nowrap">
                          <button onclick="openIpModal('${subnet.id}', '${h.ip}')" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 mr-1"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                          <button onclick="deleteHost('${h.id}')" class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </td>
                      </tr>
                    `).join('')
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderHostStatusBadge(status) {
      const map = {
        'Active':   'bg-cyan-500/15 text-cyan-300 border-cyan-500/30',
        'Reserved': 'bg-amber-500/15 text-amber-300 border-amber-500/30',
        'DHCP':     'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
        'Free':     'bg-slate-500/15 text-slate-400 border-slate-600/30'
      };
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium border ${map[status] || map.Free}">${esc(status)}</span>`;
    }

    /**
     * =========================================================================
     * 9. VIEW 4: MANAJEMEN VLAN DETAIL (FILTER BERJENJANG REGIONAL -> POP)
     * =========================================================================
     */
    function renderVlansView() {
      const availPops = getPopsByRegional(uiState.vlanFilterReg);
      if (uiState.vlanFilterPop !== 'ALL' && !availPops.some(p => p.id === uiState.vlanFilterPop)) {
        uiState.vlanFilterPop = 'ALL';
      }

      const q = uiState.vlanSearch.trim().toLowerCase();
      const filtered = db.vlans.filter(v => {
        const pop = getPopById(v.popId);
        const matchReg = uiState.vlanFilterReg === 'ALL' || v.regionalId === uiState.vlanFilterReg;
        const matchPop = uiState.vlanFilterPop === 'ALL' || v.popId === uiState.vlanFilterPop;
        const matchCat = uiState.vlanFilterCat === 'ALL' || v.category === uiState.vlanFilterCat;
        const matchStatus = uiState.vlanFilterStatus === 'ALL' || v.status === uiState.vlanFilterStatus;
        const matchQ = !q || String(v.vlanId).includes(q) || v.name.toLowerCase().includes(q) || (v.coreDevice || '').toLowerCase().includes(q) || (pop && pop.name.toLowerCase().includes(q));
        return matchReg && matchPop && matchCat && matchStatus && matchQ;
      }).sort((a, b) => a.vlanId - b.vlanId);

      return `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl lg:text-2xl font-bold text-white tracking-tight">Manajemen VLAN Detail</h2>
              <p class="text-sm text-slate-400 mt-0.5">Dokumentasi VLAN ID (1–4094) per Regional & POP, Gateway/SVI, Trunk/Access port, dan relasi Subnet.</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="inline-flex rounded-xl bg-slate-900 border border-slate-800 p-1">
                <button onclick="uiState.vlanViewMode = 'table'; renderCurrentView();" class="px-2.5 py-1.5 rounded-lg text-xs transition ${uiState.vlanViewMode === 'table' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}"><i data-lucide="table-2" class="w-4 h-4"></i></button>
                <button onclick="uiState.vlanViewMode = 'cards'; renderCurrentView();" class="px-2.5 py-1.5 rounded-lg text-xs transition ${uiState.vlanViewMode === 'cards' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-white'}"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
              </div>
              <button onclick="openVlanModal()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium shadow-lg shadow-cyan-600/20 transition">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah VLAN
              </button>
            </div>
          </div>

          <!-- Filter Bar -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
            <div class="relative">

    /**
     * =========================================================================
     * 11. VIEW 6: KALKULATOR SUBNET (CIDR) & VIEW 7: EXPORT/BACKUP
     * =========================================================================
     */
    function formatHighlightedBinary(binStr, prefix) {
      let bitCount = 0, out = '';
      for (let i = 0; i < binStr.length; i++) {
        const ch = binStr[i];
        if (ch === '.') out += `<span class="text-slate-600">.</span>`;
        else {
          out += bitCount < prefix ? `<span class="text-cyan-400">${ch}</span>` : `<span class="text-amber-400">${ch}</span>`;
          bitCount++;
        }
      }
      return out;
    }

      const areas = document.getElementById('reg-areas').value.trim();

      db.regionals.push({ id: uid('reg'), code, name, areas, description });
      addLog('Tambah Regional', `${name} (${areas}) ditambahkan`, 'cyan');

      closeModal();
      showToast(`${name} berhasil ditambahkan.`);

            </div>
          </div>

              <label class="block text-xs font-medium text-slate-400 mb-1.5">Kota / Area *</label>
              <input id="pop-area" required value="${esc(existing ? existing.area : '')}" placeholder="Bekasi" class="w-full px-3.5 py-2 bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-xl text-sm text-white outline-none" />

    function handlePopSubmit(e, editId, isQuick) {
      e.preventDefault();
      const regionalId = document.getElementById('pop-reg').value;
      const name = document.getElementById('pop-name').value.trim();
      const code = document.getElementById('pop-code').value.trim().toUpperCase();
      const area = document.getElementById('pop-area').value.trim();
      const type = document.getElementById('pop-type').value;
      const status = document.getElementById('pop-status').value;
      const address = document.getElementById('pop-address').value.trim();
      const notes = document.getElementById('pop-notes').value.trim();

      const dup = db.pops.find(p => p.code.toLowerCase() === code.toLowerCase() && p.id !== editId);
      if (dup) {
        showToast(`Kode POP ${code} sudah digunakan oleh ${dup.name}.`, 'error');
        return;
      }

      const payload = { id: editId || uid('pop'), regionalId, name, code, area, type, status, address, notes };
      const reg = getRegionalById(regionalId);

      if (editId) {
        const idx = db.pops.findIndex(p => p.id === editId);
        if (idx !== -1) db.pops[idx] = payload;
        // Sinkronkan regionalId pada subnet & vlan yang terhubung ke POP ini jika POP pindah regional
        db.subnets.forEach(s => { if (s.popId === editId) s.regionalId = regionalId; });
        db.vlans.forEach(v => { if (v.popId === editId) v.regionalId = regionalId; });
        addLog('Update POP', `${payload.name} (${payload.code}) di ${reg ? reg.name : '-'}`, 'cyan');
        showToast(`POP ${payload.name} berhasil diperbarui.`);
      } else {
        db.pops.push(payload);
        addLog('Tambah POP', `${payload.name} (${payload.code}) ditambahkan ke ${reg ? reg.name : '-'}`, 'emerald');
        showToast(`POP ${payload.name} (${payload.code}) berhasil ditambahkan.`);
      }

      saveData();
      if (isQuick) {
        closeSubModal();
        if (typeof quickPopCallback === 'function') quickPopCallback(payload);
      } else {
        closeModal();
        renderCurrentView();
      }
    }

    function deletePop(popId) {
      const pop = getPopById(popId);
      if (!pop) return;
      const st = getPopStats(popId);
      if (st.subnets.length > 0 || st.vlans.length > 0) {
        showToast(`POP ${pop.name} tidak dapat dihapus karena masih memiliki ${st.subnets.length} Subnet dan ${st.vlans.length} VLAN terkait. Pindahkan atau hapus terlebih dahulu.`, 'warning');
        return;
      }
      showConfirmModal(
        `Hapus ${pop.name}?`,
        `Anda yakin ingin menghapus ${pop.name} (${pop.code}) secara permanen?`,
        () => {
          db.pops = db.pops.filter(p => p.id !== popId);
          addLog('Hapus POP', `${pop.name} (${pop.code}) dihapus`, 'rose');
          saveData();
          showToast(`POP ${pop.name} berhasil dihapus.`, 'warning');
          renderCurrentView();
        },
        'Ya, Hapus POP'
      );
    }

    function syncSubnetModalPopAndVlan(presetPopId = null, presetVlanId = '') {
      const regId = document.getElementById('sub-reg')?.value;
      const popSel = document.getElementById('sub-pop');
      if (!popSel) return;
      const pops = getPopsByRegional(regId);
      popSel.innerHTML = pops.length
        ? pops.map(p => `<option value="${p.id}" ${presetPopId === p.id ? 'selected' : ''}>${esc(p.name)} (${esc(p.code)})</option>`).join('')
        : `<option value="">-- Belum ada POP di Regional ini --</option>`;
      syncSubnetModalVlanOnly(presetVlanId);
    }

    function syncSubnetModalVlanOnly(presetVlanId = '') {
      const popId = document.getElementById('sub-pop')?.value;
      const vlanSel = document.getElementById('sub-vlan');
      if (!vlanSel) return;
      const vlans = db.vlans.filter(v => v.popId === popId).sort((a, b) => a.vlanId - b.vlanId);
      vlanSel.innerHTML = `<option value="">-- Tanpa VLAN --</option>` +
        vlans.map(v => `<option value="${v.id}" ${presetVlanId === v.id ? 'selected' : ''}>VLAN ${v.vlanId} — ${esc(v.name)}</option>`).join('');
    }

    function quickAddPopForForm(regSelectId, popSelectId, afterCallback) {
      const currentRegId = document.getElementById(regSelectId)?.value || db.regionals[0]?.id;
      openPopModal(null, {
        isQuick: true,
        defaultRegId: currentRegId,
        onCreated: (newPop) => {
          const regEl = document.getElementById(regSelectId);
          const popEl = document.getElementById(popSelectId);
          if (regEl) regEl.value = newPop.regionalId;
          if (popEl) {
            const pops = getPopsByRegional(newPop.regionalId);
            popEl.innerHTML = pops.map(p => `<option value="${p.id}" ${p.id === newPop.id ? 'selected' : ''}>${esc(p.name)} (${esc(p.code)})</option>`).join('');
          }
          if (typeof afterCallback === 'function') afterCallback();
        }
      });
    }

    function previewSubnetCalc(autoFillGw = true) {
      const cidrEl = document.getElementById('sub-cidr');
      const gwEl = document.getElementById('sub-gw');
      const box = document.getElementById('sub-calc-preview');
      if (!cidrEl || !box) return;
      const calc = parseCIDR(cidrEl.value);
      if (!calc) {
        box.innerHTML = `<span class="text-amber-400">Format CIDR belum valid (gunakan /8 hingga /32, contoh: 10.10.100.0/24).</span>`;
        return;
      }
      if (autoFillGw && gwEl && (!gwEl.value || !isIpInSubnet(gwEl.value, calc.cidr))) gwEl.value = calc.firstUsable;
      box.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono">
          <div><span class="text-slate-500 block text-[10px]">NETWORK</span><span class="text-cyan-400">${calc.cidr}</span></div>
          <div><span class="text-slate-500 block text-[10px]">NETMASK</span><span class="text-slate-200">${calc.netmask}</span></div>
          <div><span class="text-slate-500 block text-[10px]">BROADCAST</span><span class="text-rose-400">${calc.broadcast}</span></div>
          <div><span class="text-slate-500 block text-[10px]">USABLE</span><span class="text-emerald-400">${calc.usableHosts.toLocaleString('id-ID')} IP</span></div>
        </div>
      `;

    function handleSubnetSubmit(e, editId) {
      e.preventDefault();
      const regionalId = document.getElementById('sub-reg').value;
      const popId = document.getElementById('sub-pop').value;
      if (!popId) { showToast('Pilih POP terlebih dahulu atau klik "+ Tambah POP".', 'error'); return; }

      const calc = parseCIDR(document.getElementById('sub-cidr').value.trim());
      if (!calc) { showToast('Format CIDR tidak valid (/8 hingga /32).', 'error'); return; }

      const gateway = document.getElementById('sub-gw').value.trim() || calc.firstUsable;
      if (gateway && !isIpInSubnet(gateway, calc.cidr)) {
        showToast(`Gateway ${gateway} tidak berada di dalam subnet ${calc.cidr}.`, 'error');
        return;
      }

      const dup = db.subnets.find(s => s.cidr === calc.cidr && s.popId === popId && s.id !== editId);
      if (dup) { showToast(`Subnet ${calc.cidr} sudah terdaftar di POP ini.`, 'error'); return; }

      const payload = {
        id: editId || uid('sub'),
        cidr: calc.cidr,
        name: document.getElementById('sub-name').value.trim(),
        regionalId,
        popId,
        vlanRefId: document.getElementById('sub-vlan').value || '',
        gateway,
        notes: document.getElementById('sub-notes').value.trim()
      };

      const pop = getPopById(popId);
      if (editId) {
        const idx = db.subnets.findIndex(s => s.id === editId);
        if (idx !== -1) db.subnets[idx] = payload;
        addLog('Edit Subnet', `${payload.cidr} (${payload.name}) di ${pop ? pop.name : '-'}`, 'cyan');
        showToast(`Subnet ${payload.cidr} berhasil diperbarui.`);
      } else {
        db.subnets.push(payload);
        addLog('Tambah Subnet', `${payload.cidr} (${payload.name}) ditambahkan ke ${pop ? pop.name : '-'}`, 'emerald');
        showToast(`Subnet ${payload.cidr} berhasil ditambahkan.`);
      }

      saveData();
      closeModal();
      renderCurrentView();
    }

    function deleteSubnet(subnetId) {
      const sub = db.subnets.find(s => s.id === subnetId);
      if (!sub) return;
      const hostCount = db.hosts.filter(h => h.subnetId === subnetId).length;
      showConfirmModal(
        'Hapus Subnet?',
        `Hapus subnet ${sub.cidr} (${sub.name})? ${hostCount > 0 ? `${hostCount} data IP Host di dalamnya juga akan dihapus.` : ''}`,
        () => {
          db.subnets = db.subnets.filter(s => s.id !== subnetId);
          db.hosts = db.hosts.filter(h => h.subnetId !== subnetId);
          if (uiState.selectedSubnetId === subnetId) uiState.selectedSubnetId = null;
          addLog('Hapus Subnet', `Subnet ${sub.cidr} dihapus`, 'rose');
          saveData();
          showToast(`Subnet ${sub.cidr} berhasil dihapus.`, 'warning');
          renderCurrentView();
        },
        'Ya, Hapus Subnet'
      );
    }

    function handleIpSubmit(e, subnetId, existingId) {
      e.preventDefault();
      const subnet = db.subnets.find(s => s.id === subnetId);
      if (!subnet) return;
      const calc = parseCIDR(subnet.cidr);
      const ip = document.getElementById('ip-addr').value.trim();
      const status = document.getElementById('ip-status').value;

      if (!isIpInSubnet(ip, subnet.cidr)) { showToast(`IP ${ip} di luar jangkauan subnet ${subnet.cidr}.`, 'error'); return; }
      if (calc.prefix <= 30 && (ip === calc.network || ip === calc.broadcast)) { showToast(`IP ${ip} adalah alamat Network/Broadcast.`, 'error'); return; }

      if (status === 'Free') {
        if (existingId) {
          db.hosts = db.hosts.filter(h => h.id !== existingId);
          addLog('Lepas IP', `${ip} dikembalikan ke status Available`, 'amber');
          saveData();
          showToast(`IP ${ip} dilepas.`);
        }
        closeModal(); renderCurrentView(); return;
      }

      const payload = {
        id: existingId || uid('h'),
        subnetId, ip, status,
        hostname: document.getElementById('ip-hostname').value.trim(),
        vendor: document.getElementById('ip-vendor').value,
        mac: document.getElementById('ip-mac').value.trim().toUpperCase(),
        iface: document.getElementById('ip-iface').value.trim(),
        pic: document.getElementById('ip-pic').value.trim(),
        notes: document.getElementById('ip-notes').value.trim()
      };

      const dupIdx = db.hosts.findIndex(h => h.subnetId === subnetId && h.ip === ip);
      if (dupIdx !== -1) {
        db.hosts[dupIdx] = { ...payload, id: db.hosts[dupIdx].id };
        addLog('Update IP', `${ip} → ${payload.hostname || '-'} (${payload.status})`, 'cyan');
        showToast(`IP ${ip} berhasil diperbarui.`);
      } else {
        db.hosts.push(payload);
        addLog('Assign IP', `${ip} → ${payload.hostname || '-'} (${payload.vendor})`, 'emerald');
        showToast(`IP ${ip} berhasil dialokasikan.`);
      }
      saveData(); closeModal(); renderCurrentView();
    }

    function deleteHost(hostId) {
      const host = db.hosts.find(h => h.id === hostId);
      if (!host) return;
      showConfirmModal('Lepas Alokasi IP?', `Lepas IP ${host.ip} (${host.hostname || '-'}) agar kembali Available?`, () => {
        db.hosts = db.hosts.filter(h => h.id !== hostId);
        addLog('Lepas IP', `${host.ip} dilepas`, 'amber');
        saveData(); showToast(`IP ${host.ip} dilepas.`); renderCurrentView();
      }, 'Ya, Lepas IP');
    }

    function syncVlanModalPop(presetPopId = null) {
      const regId = document.getElementById('v-reg')?.value;
      const popSel = document.getElementById('v-pop');
      if (!popSel) return;
      const pops = getPopsByRegional(regId);
      popSel.innerHTML = pops.length
        ? pops.map(p => `<option value="${p.id}" ${presetPopId === p.id ? 'selected' : ''}>${esc(p.name)} (${esc(p.code)})</option>`).join('')
        : `<option value="">-- Belum ada POP --</option>`;
    }

    function handleVlanSubmit(e, editId) {
      e.preventDefault();
      const regionalId = document.getElementById('v-reg').value;
      const popId = document.getElementById('v-pop').value;
      if (!popId) { showToast('Pilih POP terlebih dahulu.', 'error'); return; }

      const vlanId = Number(document.getElementById('v-id').value);
      if (isNaN(vlanId) || vlanId < 1 || vlanId > 4094) { showToast('VLAN ID harus antara 1 hingga 4094.', 'error'); return; }

      // Cegah duplikasi VLAN ID pada POP yang sama (POP berbeda diperbolehkan)
      const dup = db.vlans.find(v => v.vlanId === vlanId && v.popId === popId && v.id !== editId);
      const pop = getPopById(popId);
      if (dup) { showToast(`VLAN ID ${vlanId} sudah digunakan di ${pop ? pop.name : 'POP ini'} (${dup.name}).`, 'error'); return; }

      const payload = {
        id: editId || uid('vlan'),
        vlanId,
        name: document.getElementById('v-name').value.trim(),
        category: document.getElementById('v-cat').value,
        regionalId, popId,
        gatewaySvi: document.getElementById('v-svi').value.trim(),
        coreDevice: document.getElementById('v-device').value.trim(),
        trunkPorts: document.getElementById('v-trunk').value.trim(),
        accessPorts: document.getElementById('v-access').value.trim(),
        status: document.getElementById('v-status').value,
        notes: document.getElementById('v-notes').value.trim()
      };

      if (editId) {
        const idx = db.vlans.findIndex(v => v.id === editId);
        if (idx !== -1) db.vlans[idx] = payload;
        addLog('Update VLAN', `VLAN ${payload.vlanId} (${payload.name}) di ${pop ? pop.name : '-'}`, 'cyan');
        showToast(`VLAN ${payload.vlanId} berhasil diperbarui.`);
      } else {
        db.vlans.push(payload);
        addLog('Tambah VLAN', `VLAN ${payload.vlanId} (${payload.name}) di ${pop ? pop.name : '-'}`, 'violet');
        showToast(`VLAN ${payload.vlanId} berhasil ditambahkan.`);
      }
      saveData(); closeModal(); renderCurrentView();
    }

      showConfirmModal(`Hapus VLAN ${v.vlanId}?`, `Hapus VLAN ${v.vlanId} (${v.name})? Subnet tertaut akan dilepas relasinya.`, () => {

    const EXPORT_APP = {
      name: 'NetCore IPAM & VLAN Manager',
      org: 'NOC Regional & VLAN',
      version: '2.0',
      schema: 2
    };

    function exportStamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      const fileDate = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const fileTime = `${pad(d.getHours())}${pad(d.getMinutes())}`;
      return {
        file: `${fileDate}_${fileTime}`,
        date: fileDate,
        display: d.toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' })
      };
    }

    function fmtNum(n) {
      return Number(n || 0).toLocaleString('id-ID');
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function getFleetSummary() {
      let usable = 0, used = 0;
      db.subnets.forEach(s => {
        const st = getSubnetStats(s);
        usable += st.totalUsable;
        used += st.usedCount;
      });
      return {
        regionals: db.regionals.length,
        pops: db.pops.length,
        subnets: db.subnets.length,
        vlans: db.vlans.length,
        hosts: db.hosts.length,
        usable, used,
        free: Math.max(0, usable - used),
        pct: usable > 0 ? Math.round((used / usable) * 100) : 0
      };
    }

    /* ------------------------------------------------------------------
     * Dataset ekspor: satu sumber data ter-normalisasi & terurut untuk
     * Excel, CSV, maupun laporan cetak agar angka antar-format konsisten.
     * ------------------------------------------------------------------ */
    function buildExportRecords() {
      const regOrder = new Map(db.regionals.map((r, i) => [r.id, i]));
      const popOrder = new Map(db.pops.map((p, i) => [p.id, i]));
      const subnetById = new Map(db.subnets.map(s => [s.id, s]));
      const regIdx = id => (regOrder.has(id) ? regOrder.get(id) : 1e6);
      const popIdx = id => (popOrder.has(id) ? popOrder.get(id) : 1e6);
      const netIdx = s => { const c = parseCIDR(s.cidr); return c ? c.networkInt : Number.MAX_SAFE_INTEGER; };
      const ipIdx = h => { const v = ipToInt(h.ip); return v === null ? Number.MAX_SAFE_INTEGER : v; };

      const regional = db.regionals.slice()
        .sort((a, b) => regIdx(a.id) - regIdx(b.id))
        .map(r => {
          const st = getRegionalStats(r.id);
          return {
            code: r.code || '', name: r.name || '', areas: r.areas || '', description: r.description || '',
            pops: st.pops.length, subnets: st.subnets.length, vlans: st.vlans.length, hosts: st.hosts.length,
            usable: st.totalUsable, used: st.totalUsed,
            free: Math.max(0, st.totalUsable - st.totalUsed), pct: st.pct
          };
        });

      const pop = db.pops.slice()
        .sort((a, b) => regIdx(a.regionalId) - regIdx(b.regionalId) || popIdx(a.id) - popIdx(b.id))
        .map(p => {
          const reg = getRegionalById(p.regionalId);
          const st = getPopStats(p.id);
          let usable = 0, used = 0;
          st.subnets.forEach(s => { const x = getSubnetStats(s); usable += x.totalUsable; used += x.usedCount; });
          return {
            regionCode: reg ? reg.code : '', regionName: reg ? reg.name : '',
            code: p.code || '', name: p.name || '', type: p.type || '', status: p.status || '',
            area: p.area || '', address: p.address || '',
            subnets: st.subnets.length, vlans: st.vlans.length, hosts: st.hosts.length,
            usable, used, free: Math.max(0, usable - used),
            pct: usable > 0 ? Math.round((used / usable) * 100) : 0,
            notes: p.notes || ''
          };
        });

      const subnet = db.subnets.slice()
        .sort((a, b) => regIdx(a.regionalId) - regIdx(b.regionalId) || popIdx(a.popId) - popIdx(b.popId) || netIdx(a) - netIdx(b))
        .map(s => {
          const { calc, usedCount, totalUsable, pct } = getSubnetStats(s);
          const reg = getRegionalById(s.regionalId);
          const pop = getPopById(s.popId);
          const vlan = getVlanById(s.vlanRefId);
          return {
            regionName: reg ? reg.name : '', popName: pop ? pop.name : '',
            cidr: s.cidr || '', name: s.name || '',
            vlanId: vlan ? vlan.vlanId : '', vlanName: vlan ? vlan.name : '',
            gateway: s.gateway || '', netmask: calc ? calc.netmask : '', broadcast: calc ? calc.broadcast : '',
            usable: totalUsable, used: usedCount, free: Math.max(0, totalUsable - usedCount),
            pct, health: getUtilColor(pct).label, notes: s.notes || ''
          };
        });

      const vlan = db.vlans.slice()
        .sort((a, b) => regIdx(a.regionalId) - regIdx(b.regionalId) || popIdx(a.popId) - popIdx(b.popId) || Number(a.vlanId) - Number(b.vlanId))
        .map(v => {
          const reg = getRegionalById(v.regionalId);
          const pop = getPopById(v.popId);
          return {
            regionName: reg ? reg.name : '', popName: pop ? pop.name : '',
            vlanId: v.vlanId, name: v.name || '', category: v.category || '',
            gatewaySvi: v.gatewaySvi || '', status: v.status || '', coreDevice: v.coreDevice || '',
            trunkPorts: v.trunkPorts || '', accessPorts: v.accessPorts || '', notes: v.notes || ''
          };
        });

      const host = db.hosts.slice()
        .sort((a, b) => {
          const sa = subnetById.get(a.subnetId), sb = subnetById.get(b.subnetId);
          return regIdx(sa ? sa.regionalId : '') - regIdx(sb ? sb.regionalId : '') ||
            popIdx(sa ? sa.popId : '') - popIdx(sb ? sb.popId : '') ||
            (sa ? netIdx(sa) : 0) - (sb ? netIdx(sb) : 0) ||
            ipIdx(a) - ipIdx(b);
        })
        .map(h => {
          const sub = subnetById.get(h.subnetId);
          const reg = sub ? getRegionalById(sub.regionalId) : null;
          const pop = sub ? getPopById(sub.popId) : null;
          const vlan = sub ? getVlanById(sub.vlanRefId) : null;
          return {
            regionName: reg ? reg.name : '', popName: pop ? pop.name : '',
            cidr: sub ? sub.cidr : '', vlanId: vlan ? vlan.vlanId : '',
            ip: h.ip || '', hostname: h.hostname || '', status: h.status || '',
            vendor: h.vendor || '', mac: h.mac || '', iface: h.iface || '',
            pic: h.pic || '', notes: h.notes || ''
          };
        });

      return { regional, pop, subnet, vlan, host };
    }

    /* ------------------------------ CSV ------------------------------- */
    function csvEscape(value, delim, isNumeric) {
      let s = value === null || value === undefined ? '' : String(value);
      if (!s) return '';
      if (!isNumeric && /^[=+@\t]/.test(s)) s = "'" + s;
      return (s.includes(delim) || /["\r\n]/.test(s)) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function exportCSV(kind, filenamePrefix) {
      const cols = EXPORT_COLUMNS[kind];
      const records = buildExportRecords()[kind];
      const delim = uiState.csvDelimiter === ';' ? ';' : ',';
      const lines = [cols.map(c => csvEscape(c.label, delim, true)).join(delim)];
      records.forEach(rec => {
        lines.push(cols.map(c => csvEscape(rec[c.key], delim, c.type === 'num' || c.type === 'pct')).join(delim));
      });
      const content = '\uFEFF' + lines.join('\r\n') + '\r\n';
      downloadFile(content, `${filenamePrefix}-${exportStamp().file}.csv`, 'text/csv;charset=utf-8;');
      return records.length;
    }

    function exportPopsCSV(silent = false) {
      const n = exportCSV('pop', 'netcore-ipam-regional-pop');
      if (!silent) showToast(`Regional & POP (${n} baris) berhasil diekspor ke CSV.`);
    }

    function exportSubnetsCSV(silent = false) {
      const n = exportCSV('subnet', 'netcore-ipam-subnet');
      if (!silent) showToast(`Subnet & utilisasi (${n} baris) berhasil diekspor ke CSV.`);
    }

    function exportVlansCSV(silent = false) {
      const n = exportCSV('vlan', 'netcore-ipam-vlan');
      if (!silent) showToast(`Data VLAN (${n} baris) berhasil diekspor ke CSV.`);
    }

    function exportHostsCSV(silent = false) {
      const n = exportCSV('host', 'netcore-ipam-ip-host');
      if (!silent) showToast(`Alokasi IP Host (${n} baris) berhasil diekspor ke CSV.`);
    }

    /* ----------------------------- EXCEL ------------------------------ */
    function buildDataSheet(kind) {
      const cols = EXPORT_COLUMNS[kind];
      const records = buildExportRecords()[kind];
      const aoa = [cols.map(c => c.label)];
      records.forEach(rec => {
        aoa.push(cols.map(c => {
          const v = rec[c.key];
          if (c.type === 'pct') return { t: 'n', v: (Number(v) || 0) / 100, z: '0%' };
          if (c.type === 'num') {
            return Number.isFinite(Number(v)) && v !== '' && v !== null && v !== undefined
              ? { t: 'n', v: Number(v), z: '#,##0' }
              : '';
          }
          return v === null || v === undefined ? '' : String(v);
        }));
      });
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = cols.map(c => {
        let max = c.label.length;
        records.forEach(rec => {
          const v = rec[c.key];
          const s = c.type === 'pct' ? `${v}%` : (v === null || v === undefined ? '' : String(v));
          if (s.length > max) max = s.length;
        });
        return { wch: Math.max(10, Math.min(max + 2, 48)) };
      });
      if (records.length > 0) {
        ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: records.length, c: cols.length - 1 } }) };
      }
      return ws;
    }

    function buildSummarySheet() {
      const stamp = exportStamp();
      const sum = getFleetSummary();
      const regional = buildExportRecords().regional;
      const n = v => ({ t: 'n', v: Number(v) || 0, z: '#,##0' });
      const p = v => ({ t: 'n', v: (Number(v) || 0) / 100, z: '0%' });
      const aoa = [
        ['LAPORAN INFRASTRUKTUR JARINGAN — IPAM & VLAN'],
        [`${EXPORT_APP.name} · ${EXPORT_APP.org}`],
        ['Dibuat', stamp.display],
        ['Sumber Data', 'Database lokal browser (localStorage)'],
        ['Format', 'Workbook Excel — 6 sheet'],
        [],
        ['RINGKASAN DATASET', 'Jumlah'],
        ['Total Regional', n(sum.regionals)],
        ['Total POP', n(sum.pops)],
        ['Total Subnet', n(sum.subnets)],
        ['Total VLAN', n(sum.vlans)],
        ['Entri IP Host', n(sum.hosts)],
        ['Kapasitas IP Usable', n(sum.usable)],
        ['IP Terpakai', n(sum.used)],
        ['IP Tersedia', n(sum.free)],
        ['Utilisasi Keseluruhan', p(sum.pct)],
        [],
        ['RINGKASAN PER REGIONAL'],
        ['Kode', 'Regional', 'Jumlah POP', 'Jumlah Subnet', 'Jumlah VLAN', 'Entri Host', 'Kapasitas IP', 'IP Terpakai', 'IP Tersedia', 'Utilisasi']
      ];
      regional.forEach(r => aoa.push([
        r.code, r.name, n(r.pops), n(r.subnets), n(r.vlans), n(r.hosts), n(r.usable), n(r.used), n(r.free), p(r.pct)
      ]));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [{ wch: 22 }, { wch: 28 }, { wch: 13 }, { wch: 14 }, { wch: 13 }, { wch: 12 }, { wch: 14 }, { wch: 13 }, { wch: 13 }, { wch: 12 }];
      ws['!merges'] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
        { s: { r: 1, c: 0 }, e: { r: 1, c: 5 } }
      ];
      return ws;
    }

    function exportAllCSVFallback() {
      exportCSV('pop', 'netcore-ipam-regional-pop');

    }

    function exportAllXLSX() {
      if (typeof XLSX === 'undefined') {
        exportAllCSVFallback();
        return;
      }
      try {
        const wb = XLSX.utils.book_new();
        wb.Props = {
          Title: 'Laporan Infrastruktur IPAM & VLAN',
          Subject: 'Laporan Regional, POP, Subnet, VLAN, dan Alokasi IP Host',
          Author: EXPORT_APP.name,
          Company: EXPORT_APP.org,
          CreatedDate: new Date()
        };
        XLSX.utils.book_append_sheet(wb, buildSummarySheet(), 'Ringkasan');
        XLSX.utils.book_append_sheet(wb, buildDataSheet('regional'), 'Regional');
        XLSX.utils.book_append_sheet(wb, buildDataSheet('pop'), 'POP');
        XLSX.utils.book_append_sheet(wb, buildDataSheet('subnet'), 'Subnet');
        XLSX.utils.book_append_sheet(wb, buildDataSheet('vlan'), 'VLAN');
        XLSX.utils.book_append_sheet(wb, buildDataSheet('host'), 'IP Host');
        const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
        downloadFile(out, `NetCore-IPAM-Laporan-${exportStamp().file}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        showToast('Laporan Excel 6 sheet berhasil diunduh.');

    /* ------------------------------ JSON ------------------------------- */

      const payload = {

      };

    function triggerRestoreJSON() { document.getElementById('json-restore-input').click(); }

    function handleRestoreJSONFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.regionals) || !Array.isArray(parsed.pops) || !Array.isArray(parsed.subnets) || !Array.isArray(parsed.vlans) || !Array.isArray(parsed.hosts)) {
            throw new Error('Format JSON tidak memiliki struktur Regional/POP/Subnet/VLAN/Host yang valid.');
          }
          db = {
            regionals: parsed.regionals,
            pops: parsed.pops,
            subnets: parsed.subnets,
            vlans: parsed.vlans,
            hosts: parsed.hosts,
            logs: Array.isArray(parsed.logs) ? parsed.logs : []
          };
          addLog('Restore Data', `Database dipulihkan dari ${file.name} (${db.regionals.length} regional, ${db.pops.length} POP, ${db.subnets.length} subnet, ${db.vlans.length} VLAN, ${db.hosts.length} IP host)`, 'emerald');
          saveData();
          uiState.selectedSubnetId = null;
          renderCurrentView();
          showToast('Database berhasil dipulihkan dari JSON.');
        } catch (err) {
          showToast('Gagal restore JSON: ' + err.message, 'error');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

          showToast('Database telah direset ke data demo.', 'info');
        },

      );
